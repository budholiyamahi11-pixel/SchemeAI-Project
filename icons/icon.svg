<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Tricolor Bar Indicator -->
  <rect x="110" y="86" width="94" height="10" rx="5" fill="#ff9933"/>
  <rect x="209" y="86" width="94" height="10" rx="5" fill="#ffffff"/>
  <rect x="308" y="86" width="94" height="10" rx="5" fill="#138808"/>
  <!-- Central Emblem: Classical Pillar Structure -->
  <!-- Pediment / Roof -->
  <polygon points="256,126 120,206 392,206" fill="#ffffff"/>
  <polygon points="256,142 144,206 368,206" fill="url(#goldGrad)"/>
  <!-- Entablature beam -->
  <rect x="110" y="206" width="292" height="20" rx="4" fill="#ffffff"/>
  <!-- 4 Pillars -->
  <rect x="135" y="236" width="28" height="126" rx="6" fill="#ffffff"/>
  <rect x="205" y="236" width="28" height="126" rx="6" fill="#ffffff"/>
  <rect x="279" y="236" width="28" height="126" rx="6" fill="#ffffff"/>
  <rect x="349" y="236" width="28" height="126" rx="6" fill="#ffffff"/>
  <!-- Base steps -->
  <rect x="110" y="372" width="292" height="22" rx="4" fill="#ffffff"/>
  <rect x="90" y="400" width="332" height="24" rx="6" fill="url(#goldGrad)"/>
  <!-- SchemeAI Pill Badge -->
  <rect x="176" y="434" width="160" height="36" rx="18" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <text x="256" y="459" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SCHEME AI</text>
</svg>
